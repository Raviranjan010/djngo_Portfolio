{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ name }} | Student Portfolio{% endblock %}</title>
    <meta name="description" content="{% block meta_desc %}{{ intro_sub }}{% endblock %}">
    <meta name="keywords" content="Ravi Ranjan Kashyap, Django portfolio, computer science student, UI UX designer, web developer">
    <meta name="author" content="{{ name }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ name }} | Computer Science Portfolio">
    <meta property="og:description" content="{{ intro_sub }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'base/css/main.css' %}">
</head>
<body>
    <div class="loader" id="loader" aria-hidden="true">
        <div class="loader-mark">RRK</div>
        <div class="loader-line"><span></span></div>
    </div>

    <div class="scroll-progress" id="scroll-progress"></div>
    {% include "base/navbar.html" %}

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include "base/footer.html" %}

    <button class="scroll-top" id="scroll-top" aria-label="Scroll to top">UP</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="{% static 'base/js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
