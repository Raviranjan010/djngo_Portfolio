<header class="site-header" id="site-header">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="nav-shell">
        <a href="{% url 'base:home' %}" class="brand" aria-label="{{ name }} home">
            <span class="brand-sigil">{{ initials }}</span>
            <span class="brand-copy">
                <strong>Ravi Ranjan</strong>
                <small>Student Developer</small>
            </span>
        </a>

        <nav class="nav-links" id="nav-links" aria-label="Primary navigation">
            <a href="{% url 'base:home' %}" class="{% if page == 'home' %}active{% endif %}">Home</a>
            <a href="{% url 'base:about' %}" class="{% if page == 'about' %}active{% endif %}">About</a>
            <a href="{% url 'base:home' %}#projects">Projects</a>
            <a href="{% url 'base:home' %}#skills">Skills</a>
            <a href="{% url 'base:home' %}#contact">Contact</a>
        </nav>

        <div class="nav-actions">
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark and light mode">
                <span class="theme-icon">D</span>
            </button>
            <a href="{% url 'base:home' %}#contact" class="nav-contact">Let's Talk</a>
            <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
                <span></span><span></span>
            </button>
        </div>
    </div>
</header>
